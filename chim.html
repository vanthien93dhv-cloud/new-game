
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flappy Bird Game</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #172033;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
    overflow: hidden;
}
.game {
    position: relative;
    width: min(100vw, 430px);
    height: min(100dvh, 760px);
    overflow: hidden;
    background: #70c5ce;
    border: 4px solid #fff;
    border-radius: 12px;
}
canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}
.hud {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 42px;
    font-weight: bold;
    text-shadow: 2px 3px #333;
    pointer-events: none;
}
.overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: #0005;
    color: white;
    text-align: center;
    padding: 24px;
}
.overlay h1 { font-size: 34px; margin: 0 0 12px; }
.overlay p { line-height: 1.6; }
button {
    border: 0;
    border-radius: 30px;
    background: #ffcf33;
    color: #463600;
    padding: 14px 30px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}
.hidden { display: none; }
</style>
</head>
<body>
<div class="game">
    <canvas id="gameCanvas"></canvas>
    <div class="hud" id="score">0</div>
    <div class="overlay" id="overlay">
        <h1 id="title">🐦 Chim Bay</h1>
        <p id="message">Chạm màn hình để bay.<br>Vượt qua các ống nước để ghi điểm!</p>
        <button id="startBtn">BẮT ĐẦU CHƠI</button>
    </div>
</div>

<script>
(() => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const startBtn = document.getElementById('startBtn');
    const scoreEl = document.getElementById('score');

    let W, H, bird, pipes, score, best = 0;
    let state = 'ready';
    let lastTime = 0;
    let pipeTimer = 0;

    try {
        best = Number(localStorage.getItem('flappyBest')) || 0;
    } catch (e) {}

    function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = rect.width;
        H = rect.height;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (state !== 'playing') draw();
    }

    function reset() {
        bird = {
            x: W * 0.28,
            y: H * 0.42,
            r: 15,
            vy: 0,
            rotation: 0
        };
        pipes = [];
        score = 0;
        pipeTimer = 0;
        scoreEl.textContent = '0';
    }

    function start() {
        reset();
        state = 'playing';
        overlay.classList.add('hidden');
        lastTime = performance.now();
    }

    function flap() {
        if (state === 'ready' || state === 'over') {
            start();
            bird.vy = -390;
            return;
        }
        if (state === 'playing') bird.vy = -390;
    }

    function endGame() {
        if (state !== 'playing') return;
        state = 'over';

        if (score > best) {
            best = score;
            try {
                localStorage.setItem('flappyBest', best);
            } catch (e) {}
        }

        title.textContent = '💥 Game Over!';
        message.innerHTML =
            'Điểm: <b>' + score + '</b><br>' +
            'Kỷ lục: <b>' + best + '</b>';
        startBtn.textContent = 'CHƠI LẠI';
        overlay.classList.remove('hidden');
    }

    function addPipe() {
        const gap = Math.max(140, Math.min(180, H * 0.24));
        const margin = 70;
        const top = margin + Math.random() *
            Math.max(1, H - gap - margin * 2);

        pipes.push({
            x: W + 10,
            top,
            gap,
            width: 58,
            passed: false
        });
    }

    function roundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        ctx.fill();
    }

    function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#70c5ce');
        sky.addColorStop(1, '#d8f5ce');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        // Clouds
        ctx.fillStyle = '#ffffffaa';
        for (const c of [
            [W*.18,H*.18,25],
            [W*.72,H*.27,30],
            [W*.48,H*.10,18]
        ]) {
            ctx.beginPath();
            ctx.arc(c[0], c[1], c[2], 0, Math.PI*2);
            ctx.arc(c[0]+c[2], c[1]-7, c[2]*.8, 0, Math.PI*2);
            ctx.arc(c[0]+c[2]*1.7, c[1], c[2]*.7, 0, Math.PI*2);
            ctx.fill();
        }

        // Ground
        ctx.fillStyle = '#ded895';
        ctx.fillRect(0, H-32, W, 32);
        ctx.fillStyle = '#78c64a';
        ctx.fillRect(0, H-36, W, 8);
    }

    function drawPipe(p) {
        const bottomY = p.top + p.gap;
        ctx.fillStyle = '#36b82e';
        ctx.strokeStyle = '#237a20';
        ctx.lineWidth = 3;

        ctx.fillRect(p.x, 0, p.width, p.top - 18);
        ctx.strokeRect(p.x, -2, p.width, p.top - 16);
        ctx.fillRect(p.x - 5, p.top - 24, p.width + 10, 24);
        ctx.strokeRect(p.x - 5, p.top - 24, p.width + 10, 24);

        ctx.fillRect(p.x, bottomY + 18, p.width, H - 32 - bottomY);
        ctx.strokeRect(p.x, bottomY + 18, p.width, H - 32 - bottomY);
        ctx.fillRect(p.x - 5, bottomY, p.width + 10, 24);
        ctx.strokeRect(p.x - 5, bottomY, p.width + 10, 24);

        ctx.fillStyle = '#83ec63';
        ctx.fillRect(p.x + 7, 0, 7, Math.max(0, p.top - 24));
        ctx.fillRect(p.x + 7, bottomY + 24, 7,
            Math.max(0, H - 32 - bottomY - 24));
    }

    function drawBird() {
        ctx.save();
        ctx.translate(bird.x, bird.y);
        ctx.rotate(bird.rotation);

        // Body
        ctx.fillStyle = '#ffdc36';
        ctx.strokeStyle = '#b77a13';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, 0, bird.r+2, bird.r, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();

        // Wing
        ctx.fillStyle = '#ffad25';
        ctx.beginPath();
        ctx.ellipse(-7, 4, 9, 6, -.3, 0, Math.PI*2);
        ctx.fill();

        // Eye
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(7, -6, 6, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(9, -6, 2.5, 0, Math.PI*2);
        ctx.fill();

        // Beak
        ctx.fillStyle = '#ff7138';
        ctx.beginPath();
        ctx.moveTo(12, 0);
        ctx.lineTo(25, 4);
        ctx.lineTo(12, 8);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    function draw() {
        drawBackground();
        if (pipes) pipes.forEach(drawPipe);
        if (bird) drawBird();
    }

    function update(dt) {
        bird.vy += 1500 * dt;
        bird.y += bird.vy * dt;
        bird.rotation = Math.min(.9, Math.max(-.5, bird.vy / 600));

        pipeTimer += dt;
        if (pipeTimer >= 1.55) {
            pipeTimer = 0;
            addPipe();
        }

        const speed = 175;
        for (const p of pipes) {
            p.x -= speed * dt;

            const bx = bird.x;
            const by = bird.y;
            const r = bird.r - 3;

            if (
                bx + r > p.x - 5 &&
                bx - r < p.x + p.width + 5 &&
                (by - r < p.top || by + r > p.top + p.gap)
            ) {
                endGame();
            }

            if (!p.passed && p.x + p.width < bird.x) {
                p.passed = true;
                score++;
                scoreEl.textContent = score;
            }
        }

        pipes = pipes.filter(p => p.x + p.width > -15);

        if (bird.y - bird.r < 0 || bird.y + bird.r > H - 36) {
            endGame();
        }
    }

    function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.035);
        lastTime = now;

        if (state === 'playing') {
            update(dt);
        } else if (state === 'ready' && bird) {
            bird.y = H * .42 + Math.sin(now / 250) * 8;
        }

        draw();
        requestAnimationFrame(loop);
    }

    canvas.addEventListener('pointerdown', e => {
        e.preventDefault();
        flap();
    });

    startBtn.addEventListener('click', e => {
        e.stopPropagation();
        flap();
    });

    document.addEventListener('keydown', e => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            flap();
        }
    });

    window.addEventListener('resize', resize);

    resize();
    reset();
    requestAnimationFrame(now => {
        lastTime = now;
        loop(now);
    });
})();
</script>
</body>
</html>
